services:
  banchonet:
    image: banchonet
    hostname: banchonet
    container_name: banchonet
    build:
      context: .
      dockerfile: BanchoNET/Dockerfile
    ports:
      - ${SERVER_PORT}:5000
    env_file:
      - .env
    volumes:
      - banchonet-lazer-data:/data/lazer
      - ${DATA_PATH:-./data}:/app/files
    restart: unless-stopped
    networks:
      - banchonet
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      MongoDB:
        condition: service_healthy

  postgres:
    image: postgres:17
    hostname: banchonet-db
    container_name: banchonet-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - banchonet-db-data:/var/lib/postgresql/data
    ports:
      - ${POSTGRES_PORT}:5432
    restart: unless-stopped
    networks:
      - banchonet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h localhost || exit 1"]
      interval: 2s
      timeout: 20s
      retries: 10

  redis:
    image: redis:8
    hostname: banchonet-redis
    container_name: banchonet-redis
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASS}
    restart: unless-stopped
    ports:
        - ${REDIS_PORT}:${REDIS_PORT}
    networks:
      - banchonet
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 2s
      timeout: 10s
      retries: 10

  MongoDB:
    image: mongo:8
    hostname: banchonet-mongo
    container_name: banchonet-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - ${MONGO_PORT}:27017
    volumes:
      - banchonet-mongo-data:/data/db
    restart: unless-stopped
    networks:
      - banchonet
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand(\"ping\").ok' || exit 1"]
      interval: 2s
      timeout: 10s
      retries: 10

networks:
  banchonet:
    name: banchonet

volumes:
  banchonet-lazer-data:
    driver: local
  banchonet-db-data:
    driver: local
  banchonet-mongo-data:
    driver: local